# OGPO with the native JAX PI0.5 base model (no JAX->PyTorch conversion).
# Mirrors pi05_flash_ogpo.yaml but swaps flow.adapter to pi05_jax and points
# flow.checkpoint_dir / evaluation.policy_dir at the Orbax JAX checkpoint.
include: configs/ogpo/pi05_gemma_udivl_critic.yaml

data:
  dataset_path: outputs/ogpo/click_mouse_pi05_replay_train.pt
  validation_path: outputs/ogpo/click_mouse_pi05_replay_validation.pt
  generated_horizon: 30
  executed_horizon: 4

actor:
  algorithm: flash_ogpo
  optimizer: adafactor
  hidden_dim: 256
  actor_delay: 0
  # A100-40G production default. Larger same-state candidate groups require
  # actor microbatching or a larger device because full PI0.5 is differentiated.
  group_size: 1
  learning_rate: 0.00005
  weight_decay: 0.0
  old_policy_sync_period: 1
  old_policy_ema: 0.995
  ppo_clip_min: 0.05
  ppo_clip_max: 0.2
  advantage_clip: 5.0
  actor_epochs_per_rollout: 1
  max_grad_norm: 1.0
  max_policy_reference_kl: 0.5

flow:
  adapter: pi05_jax
  # Native JAX (Orbax) checkpoint: directory must contain params/.
  checkpoint_dir: checkpoints/pi05/dexjoco_click_mouse
  train_config: click_mouse
  image_mapping:
    base: image_base
    wrist: image_wrist
  num_steps: 10
  selected_timestep_distribution: uniform
  stochastic_variance: 0.01
  sde_mode: ogpo_corrected
  temporal_rectification_mode: analytic
  rectification_clip_min: 0.25
  rectification_clip_max: 4.0

training:
  device: cuda
  # The critic is PyTorch and independent of the pi05 backend, so the same
  # calibrated Gemma+SigLIP critic checkpoint is reused.
  critic_checkpoint: outputs/ogpo/click_mouse_gemma_udivl_calibrated.pt
  # Bounded to finish within the one-day Slurm allocation on a single A100-40G.
  actor_steps: 100
  batch_size: 1
  checkpoint_interval: 10
  checkpoint_path: outputs/ogpo/click_mouse_pi05_jax_flash.pt
  metrics_path: outputs/ogpo/click_mouse_pi05_jax_flash_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_pi05_jax_flash

evaluation:
  tasks: [click_mouse]
  dexjoco_tasks: [click_mouse]
  policy_dir: checkpoints/pi05/dexjoco_click_mouse
  best_of_n: 1
