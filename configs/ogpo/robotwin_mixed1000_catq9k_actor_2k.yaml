include: configs/ogpo/robotwin_multitask10_Cbal12k_actor_bs4_lr2e6_1k_A10080G.yaml

data:
  dataset_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/model_init_8.pt
  dataset_paths:
    - outputs/ogpo/replays/mixed1000_bootstrap_v1/train_rank00.pt
    - outputs/ogpo/replays/mixed1000_bootstrap_v1/train_rank01.pt
    - outputs/ogpo/replays/mixed1000_bootstrap_v1/train_rank02.pt
    - outputs/ogpo/replays/mixed1000_bootstrap_v1/train_rank03.pt
  validation_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/validation_80.pt

critic:
  stage: head_td
  q_representation: categorical
  categorical_q: true
  categorical_q_loss: one_hot_ce
  q_num_bins: 201
  q_vmin: -0.1
  q_vmax: 1.1
  lambda_rank: 0.0
  enable_rankq: false
  steps_per_actor_step: 0
  backbone:
    train_siglip: false
    train_vlm_full: false

training:
  resume_checkpoint: null
  actor_start_step: 0
  actor_steps: 2000
  critic_checkpoint: outputs/ogpo/evaluations/carl_alignment_latest_snapshots_20260915_v2/catq_latest.pt
  actor_sampling:
    mode: task_balanced_cycle
    task_names: [adjust_bottle, click_alarmclock, click_bell, dump_bin_bigbin, handover_mic, open_laptop, pick_dual_bottles, place_a2b_right, place_object_stand, press_stapler]
  checkpoint_path: outputs/ogpo/robotwin_mixed1000_catq9k_actor_2k_final.pt
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_mixed1000_catq9k_actor_2k
  metrics_path: outputs/ogpo/robotwin_mixed1000_catq9k_actor_2k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_mixed1000_catq9k_actor_2k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_mixed1000_catq9k_actor_2k/resolved_config.yaml

evaluation:
  tasks: [adjust_bottle, click_alarmclock, click_bell, dump_bin_bigbin, handover_mic, open_laptop, pick_dual_bottles, place_a2b_right, place_object_stand, press_stapler]
