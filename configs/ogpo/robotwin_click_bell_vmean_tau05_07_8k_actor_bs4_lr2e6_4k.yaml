include: configs/ogpo/robotwin_click_bell_100ep_pytorch_divl5_critic5k_ogpo10q_ca_chipo_4k.yaml

# Formal actor experiment. Only the frozen critic, state batch size, and actor
# learning rate differ from the previous BS1/LR1e-6 actor.
critic:
  v_q_aggregation: mean
  v_tau_mode: adaptive
  v_tau_min: 0.5
  v_tau_max: 0.7

actor:
  group_size: 4
  candidate_group_size: 4
  learning_rate: 2.0e-6
  ppo_clip: 0.01
  ppo_clip_chain: 0.01
  actor_epochs_per_rollout: 1
  old_policy_sync_period: 1
  max_grad_norm: 1.0
  normalize_logprob_by_action_dim: true
  normalize_logprob_by_denoising_steps: true
  gradient_microbatch_size: 1

regularization:
  lambda_success: 0.0
  lambda_fm: 0.0
  beta_kl: 0.0

training:
  resume_checkpoint: null
  critic_checkpoint: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k/milestones/critic_step_08000.pt
  actor_start_step: 0
  actor_steps: 4000
  batch_size: 4
  checkpoint_interval: 100
  keep_periodic_checkpoints: true
  checkpoint_path: outputs/ogpo/robotwin_click_bell_vmean_tau05_07_8k_actor_bs4_lr2e6_4k_final.pt
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_click_bell_vmean_tau05_07_8k_actor_bs4_lr2e6_4k
  metrics_path: outputs/ogpo/robotwin_click_bell_vmean_tau05_07_8k_actor_bs4_lr2e6_4k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_click_bell_vmean_tau05_07_8k_actor_bs4_lr2e6_4k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_click_bell_vmean_tau05_07_8k_actor_bs4_lr2e6_4k/resolved_config.yaml
