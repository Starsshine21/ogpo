data:
  dataset_path: data/base_threecam90/model_init_8.pt
  generated_horizon: 50
  executed_horizon: 4
  gamma: 0.995
  n_step: 2
  success_sampling_ratio: 0.5
  use_execution_mask: true
  validation_path: data/base_threecam90/heldout.pt
  language: click the mouse
  behavior_policy: pi05_pytorch_clean50_base
  gamma_rebase:
    enabled: false
    source_gamma: 0.999
    atol: 2.0e-05
  apply_n_step_on_load: false
  dataset_paths:
  - data/base_threecam90/train_rank00.pt
  - data/base_threecam90/train_rank01.pt
  - data/base_threecam90/train_rank02.pt
  - data/base_threecam90/train_rank03.pt
  - data/clean50_threecam/demo_rank00.pt
  - data/clean50_threecam/demo_rank01.pt
  - data/clean50_threecam/demo_rank02.pt
  - data/clean50_threecam/demo_rank03.pt
  image_keys:
  - image_base
  - image_left_wrist
  - image_right_wrist
  distributed_dataset_path_pattern: null
  dataset_preprocessed: true
critic:
  ensemble_size: 5
  hidden_dim: 128
  num_layers: 2
  feature_source: replay_state
  shared_frozen_encoder: false
  train_last_n_backbone_layers: 0
  detach_policy_features: true
  bootstrap_probability: 1.0
  randomized_prior_scale: 0.0
  target_tau: 0.005
  target_update_period: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  huber_delta: 1.0
  warmup_steps: 5
  steps_per_actor_step: 0
  max_grad_norm: 5.0
  reference_value_samples: 4
  lambda_divl_target: 0.75
  lambda_mc: 0.0
  bootstrap_target: memberwise
  min_ranking_accuracy: 0.55
  min_coverage: 0.8
  force_actor: true
  enable_rankq: false
  lambda_rank: 0.0
  rankq_noise_sigma: 0.15
  architecture: gemma_siglip_multihead
  stage: head_td
  action_hidden_dim: 256
  action_attention_heads: 8
  head_hidden_dim: 512
  backbone:
    gemma_path: checkpoints/models/gemma-3-270m
    siglip_path: checkpoints/models/siglip2-so400m-patch14-224-fixed
    camera_keys:
    - image_base
    - image_left_wrist
    - image_right_wrist
    dtype: bfloat16
    max_language_tokens: 64
    train_siglip: false
    train_vlm_full: false
    gradient_checkpointing: true
  gemma_lora:
    final_n_layers: 0
    rank: 8
    alpha: 16.0
    learning_rate: 1.0e-05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  stage_gates:
    min_stage_steps: 500
    min_pairwise_ranking_accuracy: 0.55
    min_interval_coverage: 0.8
    max_categorical_saturation: 0.2
    max_abs_exploitation_gap: 0.5
  double_q_divl: true
  q_heads_per_member: 2
  q_representation: scalar
  categorical_q: false
  q_loss: mse
  q_vmin: -0.1
  q_vmax: 1.1
  rankq:
    enabled: false
  rank_consensus_enabled: false
  target_mode: td
  update_period_actor_steps: 0
  steps_per_refresh: 0
  gate_enabled: false
  expected_num_pairs: 5
  expected_num_raw_q_heads: 10
  v_q_aggregation: mean
  v_tau_mode: adaptive
  v_tau_min: 0.5
  v_tau_max: 0.7
  categorical_q_loss: one_hot_ce
  q_num_bins: 201
divl:
  num_atoms: 201
  v_min: -0.1
  v_max: 1.1
  alpha_min: 0.0
  alpha_max: 1.0
  entropy_temperature: 1.0
  use_adaptive_quantile: true
  loss_weight: 1.0
  enabled: true
  auto_support: false
  support_margin_fraction: 0.05
  adaptive_tau: true
  tau_base: 0.6
  entropy_coefficient: 0.3
  tau_min: 0.3
  tau_max: 0.6
  interpolate_quantile: false
uncertainty:
  adapt_ppo_clip: false
  adapt_kl_beta: false
  use_conformal: true
  conformal_delta: 0.1
  min_calibration_samples: 64
  positive_margin: 0.0
  negative_margin: 0.0
  lcb_kappa: 1.0
  entropy_scale: 0.5
  entropy_skip_threshold: 0.98
  consensus_skip_threshold: 0.05
  use_support_weight: true
  lambda_epi: 0.5
  lambda_support: 0.5
  support_threshold: 10.0
actor:
  group_size: 8
  hidden_dim: 128
  learning_rate: 5.0e-05
  ppo_clip_min: 0.01
  ppo_clip_max: 0.01
  advantage_clip: 5.0
  actor_epochs_per_rollout: 1
  actor_delay: 0
  old_policy_sync_period: 1
  old_policy_ema: 0.0
  max_grad_norm: 1.0
  max_policy_reference_kl: 1.2
  max_critic_disagreement: 5.0
  max_support_distance: 10.0
  advantage_mode: conservative
  lambda_abs_start: 1.0
  lambda_abs_end: 1.0
  lambda_abs_warmup_steps: 0
  algorithm: flash_ogpo
  ogpo_variant: ca_chi2
  use_ca: true
  use_chipo: true
  flash_enabled: true
  temporal_rectification: false
  full_ratio_mode: ais_joint
  ppo_clip: 0.01
  full_chain: false
  candidate_group_size: 8
  optimizer: adafactor
  weight_decay: 0.0
  gradient_microbatch_size: 16
  normalize_logprob_by_action_dim: true
  normalize_logprob_by_denoising_steps: true
  ppo_clip_chain: 0.01
  full_chain_log_ratio_clip: 20.0
  reject_update_on_kl: false
  post_update_kl_action: monitor
  max_consecutive_kl_rejections: 10
  residual_enabled: false
  chi2:
    enabled: true
    ratio_scope: selected_transition
    require_single_epoch: true
    normalize_action_dim: true
    normalize_denoising_steps: true
    beta_base: 0.1
    q_std_target: 1.0
    ensemble_alpha: 5.0
    r_max: 10.0
    slow_policy_tau: 0.0005
    slow_policy_update_period: 1
    apply_project_safety_gates: false
    legacy_extra_chi2_loss: false
    logprob_microbatch_size: 8
  q_ensemble_source: raw_heads
  q_ensemble_size: 10
  q_correlation_log_period: 100
  rollback_snapshot_device: cpu
  kl_eval_microbatch_size: 1
  compute_step_grad_diagnostics: false
  reference_kl_enabled: false
flow:
  adapter: pi05_pytorch
  convention: openpi_pi05_euler
  num_steps: 10
  selected_timestep_distribution: uniform
  selected_timestep: 3
  stochastic_variance: 0.0001
  temporal_rectification_mode: none
  rectification_clip_min: 0.25
  rectification_clip_max: 4.0
  sde_mode: ogpo_constant_corrected
  checkpoint_dir: checkpoints/pi05/model_clean50
  train_config: pi05_robotwin2_clean50_full
  backend_train_mode: action_expert
  image_container_key: images
  transpose_images_to_chw: true
  image_mapping_override:
    cam_high: image_base
    cam_left_wrist: image_left_wrist
    cam_right_wrist: image_right_wrist
  use_constant_noise: true
  error_correct_sde_to_ode: true
  constant_noise_std: 0.005
  learn_sde_std: false
  randn_clip_value: 3.0
  temporal_rectification: false
  pytorch_role_devices:
    current: cuda:0
    old: cuda:1
    slow: cuda:2
    reference: cuda:3
  frozen_prefix_cache: true
  latent_action_dim: model
regularization:
  beta_kl: 0.0
  kl_uncertainty_scale: 1.0
  lambda_fm: 0.0
  lambda_success: 0.005
  lambda_smooth: 0.0
  smooth_acceleration_eta: 0.1
  actor_regularization_epochs_per_rollout: 1
  success_update_period: 1
  success_batch_size: 1
  adaptive_success_bc:
    enabled: true
    lambda0: 0.005
    rho: 0.2
    eps: 1.0e-12
training:
  device: cuda
  seed: 20260920
  batch_size: 8
  critic_steps: 6000
  output_dir: outputs/ogpo
  checkpoint_path: outputs/ogpo/actors/threecam_flash_headonly_g8_adaptivebc20_noref/final.pt
  metrics_path: outputs/ogpo/actors/threecam_flash_headonly_g8_adaptivebc20_noref/metrics.jsonl
  tensorboard_dir: outputs/ogpo/actors/threecam_flash_headonly_g8_adaptivebc20_noref/tensorboard
  early_stopping:
    enabled: true
    metric: validation_q_huber
    mode: min
    patience: 20
    min_delta: 0.0001
  clean_pytorch_main: false
  critic_frozen_during_actor: true
  critic_checkpoint: outputs/ogpo/checkpoints/threecam_scalar_guarded_20k/milestones/critic_step_08000.pt
  actor_start_step: 0
  actor_steps: 10000
  checkpoint_interval: 1000
  keep_periodic_checkpoints: true
  periodic_checkpoint_dir: outputs/ogpo/actors/threecam_flash_headonly_g8_adaptivebc20_noref/checkpoints
  resume_checkpoint: null
  config_snapshot_path: outputs/ogpo/actors/threecam_flash_headonly_g8_adaptivebc20_noref/resolved_config.yaml
  offload_frozen_critic_during_actor_optimization: false
  save_final_checkpoint: true
  actor_sampling:
    mode: task_balanced_cycle
    task_names:
    - adjust_bottle
    - click_alarmclock
    - click_bell
    - dump_bin_bigbin
    - handover_mic
    - open_laptop
    - pick_dual_bottles
    - place_a2b_right
    - place_object_stand
    - press_stapler
  replay_generator_resume_step: 0
evaluation:
  interval: 50
  num_episodes: 1
  seeds:
  - 0
  tasks:
  - adjust_bottle
  - click_alarmclock
  - click_bell
  - dump_bin_bigbin
  - handover_mic
  - open_laptop
  - pick_dual_bottles
  - place_a2b_right
  - place_object_stand
  - press_stapler
  dexjoco_tasks:
  - click_bell
  config_set: rand_obj
  validation_batch_size: 16
  best_of_n: 1
  policy_dir: checkpoints/pi05/model_clean50
method:
  name: divl-ogpo-ca-chipo-fullchain
  backend: pytorch
offline:
  mode: pure_offline
  critic_update_during_actor: false
inference:
  dynamics: native_ode
