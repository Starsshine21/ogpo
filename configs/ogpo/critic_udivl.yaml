data:
  dataset_path: outputs/ogpo/smoke_replay.pt
  generated_horizon: 6
  executed_horizon: 3
  gamma: 0.97
  n_step: 1
  success_sampling_ratio: 0.5
  use_execution_mask: true

critic:
  ensemble_size: 3
  hidden_dim: 128
  num_layers: 2
  feature_source: replay_state
  shared_frozen_encoder: false
  train_last_n_backbone_layers: 0
  detach_policy_features: true
  bootstrap_probability: 0.8
  randomized_prior_scale: 0.0
  target_tau: 0.05
  target_update_period: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  huber_delta: 1.0
  warmup_steps: 5
  steps_per_actor_step: 4
  max_grad_norm: 10.0
  reference_value_samples: 0
  lambda_divl_target: 1.0
  lambda_mc: 0.0
  bootstrap_target: ensemble_mean
  min_ranking_accuracy: 0.0
  min_coverage: 0.0
  force_actor: false
  # Vanilla RankQ is opt-in. Disabled mode preserves the original TD critic.
  enable_rankq: false
  lambda_rank: 1.0
  rankq_noise_sigma: 0.15

divl:
  num_atoms: 51
  v_min: -5.0
  v_max: 5.0
  alpha_min: 0.5
  alpha_max: 0.8
  entropy_temperature: 1.0
  use_adaptive_quantile: true
  loss_weight: 1.0

uncertainty:
  adapt_ppo_clip: false
  adapt_kl_beta: false
  use_conformal: false
  conformal_delta: 0.1
  min_calibration_samples: 16
  positive_margin: 0.0
  negative_margin: 0.0
  lcb_kappa: 1.0
  entropy_scale: 0.5
  entropy_skip_threshold: 0.98
  consensus_skip_threshold: 0.05
  use_support_weight: false
  lambda_epi: 0.0
  lambda_support: 0.0
  support_threshold: 10.0

actor:
  group_size: 4
  hidden_dim: 128
  learning_rate: 0.0001
  ppo_clip_min: 0.05
  ppo_clip_max: 0.2
  advantage_clip: 5.0
  actor_epochs_per_rollout: 1
  actor_delay: 0
  old_policy_sync_period: 1
  old_policy_ema: 0.0
  max_grad_norm: 1.0
  max_policy_reference_kl: 0.5
  max_critic_disagreement: 5.0
  max_support_distance: 10.0
  advantage_mode: sign_consensus
  lambda_abs_start: 1.0
  lambda_abs_end: 1.0
  lambda_abs_warmup_steps: 0

flow:
  adapter: gaussian_openpi
  convention: openpi_pi05_euler
  num_steps: 6
  selected_timestep_distribution: uniform
  selected_timestep: 3
  stochastic_variance: 0.04
  temporal_rectification_mode: analytic
  rectification_clip_min: 0.25
  rectification_clip_max: 4.0

regularization:
  beta_kl: 0.01
  kl_uncertainty_scale: 1.0
  lambda_fm: 0.1
  lambda_success: 0.1
  lambda_smooth: 0.0
  smooth_acceleration_eta: 0.1

training:
  device: cpu
  seed: 0
  batch_size: 16
  critic_steps: 5
  output_dir: outputs/ogpo
  checkpoint_path: outputs/ogpo/udivl_smoke.pt
  metrics_path: outputs/ogpo/critic_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard

evaluation:
  interval: 10
  num_episodes: 1
  seeds: [0]
  tasks: [synthetic_task]
  dexjoco_tasks: [click_mouse]
  config_set: rand_obj
