include: configs/ogpo/robotwin_click_bell_100ep_pytorch_divl_5pair_g995_8k.yaml

# Controlled DIVL experiment: change only categorical-V supervision from
# pair-min to pair-mean and raise the entropy-adaptive quantile interval.
critic:
  max_grad_norm: 5.0
  enable_rankq: false
  rankq:
    enabled: false
    lambda_rank: 0.0
    mild_sigma: 0.02
    strong_sigma: 0.05
    logged_mild_weight: 1.0
    mild_strong_weight: 1.0
    strong_random_weight: 1.0
    use_success_only: true
    use_random_negative: true
  rank_consensus_enabled: false
  v_q_aggregation: mean
  v_tau_mode: adaptive
  v_tau_min: 0.5
  v_tau_max: 0.7

training:
  resume_checkpoint: null
  critic_steps: 8000
  expected_world_size: 4
  early_stopping:
    enabled: false
  checkpoint_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k/critic_step_08000_final.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k/latest.pt
  best_checkpoint_path: null
  milestone_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k/milestones
  metrics_path: outputs/ogpo/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_vmean_tau05_07_gn5_8k/resolved_config.yaml
