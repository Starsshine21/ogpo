include: configs/ogpo/robotwin_pick_dual_bottles_clean50_pytorch_divl_ogpo_ca_chipo_fullchain_g995.yaml

# Critic-only offline training companion for the clean actor config.
training:
  clean_pytorch_main: false
  critic_checkpoint: null
  critic_steps: 4000
  batch_size: 32
  microbatch_size: 8
  checkpoint_interval: 500
  checkpoint_path: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_critic_g995/critic_step_04000_final.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_critic_g995/latest.pt
  best_checkpoint_path: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_critic_g995/best.pt
  milestone_steps: [500, 1000, 1500, 2000, 2500, 3000, 3500, 4000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_critic_g995/milestones
  metrics_path: outputs/ogpo/robotwin_pick_dual_bottles_divl_critic_g995_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_pick_dual_bottles_divl_critic_g995
  device: cuda

# The critic trainer never samples an actor.  Use the lightweight Gaussian
# adapter solely to satisfy the shared train-state container and avoid loading
# a 4B PI0.5 backend during critic-only offline fitting.
flow:
  adapter: gaussian_openpi
  num_steps: 1
  stochastic_variance: 0.04
  sde_mode: gaussian_adapter

actor:
  ogpo_variant: ca
  # Actor fields are inert when invoking train_udivl_critic.py.
  flash_enabled: false
