include: configs/ogpo/robotwin_pick_dual_bottles_pytorch_divl_5pair_g995.yaml

data:
  dataset_path: outputs/ogpo/replays/robotwin_click_bell_dense_100ep_g999_train.pt
  distributed_dataset_path_pattern: outputs/ogpo/replays/robotwin_click_bell_dense_100ep_g995_n2_train_rank{rank:02d}.pt
  distributed_dataset_preprocessed: true
  distributed_model_init_path: outputs/ogpo/replays/robotwin_click_bell_model_init_8.pt
  # Full validation cannot coexist with four rank replays under the node's
  # effective host-memory limit.  This run has no early stopping or best-model
  # selection, so use this fixed schema sample only for progress metrics.
  distributed_validation_path: outputs/ogpo/replays/robotwin_click_bell_model_init_8.pt
  validation_path: outputs/ogpo/replays/robotwin_click_bell_dense_100ep_g999_validation.pt
  behavior_policy: pi05_pytorch_clean50_base
  gamma: 0.995
  gamma_rebase:
    enabled: true
    source_gamma: 0.999
    atol: 0.00002
  n_step: 2
  apply_n_step_on_load: true

critic:
  # The previous 5.0 ceiling clipped 59.31% of its 8k updates. At 50.0,
  # only 1.06% of those recorded pre-clip norms would have been clipped.
  max_grad_norm: 50.0

training:
  critic_steps: 8000
  expected_world_size: 4
  # Four ranks retain global batch 32 (8 samples/rank); accumulate each
  # rank-local batch in single-sample forwards to fit the cluster's 4GiB
  # per-process GPU cgroup despite A100-80G hardware.
  microbatch_size: 1
  early_stopping:
    enabled: false
  checkpoint_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_gn50_8k/critic_step_08000_final.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_gn50_8k/latest.pt
  best_checkpoint_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_gn50_8k/best.pt
  milestone_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_gn50_8k/milestones
  metrics_path: outputs/ogpo/robotwin_click_bell_divl_5pair_g995_gn50_8k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_click_bell_divl_5pair_g995_gn50_8k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_gn50_8k/resolved_config.yaml

evaluation:
  tasks: [click_bell]
  dexjoco_tasks: [click_bell]
