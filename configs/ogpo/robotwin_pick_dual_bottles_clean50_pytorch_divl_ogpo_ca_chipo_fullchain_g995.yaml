include: configs/ogpo/pi05_gemma_udivl_critic.yaml

# Clean PyTorch-only offline DIVL + full-chain OGPO main path.  Existing
# configs (including JAX and Flash experiments) are intentionally not changed.
method:
  name: divl-ogpo-ca-chipo-fullchain
  backend: pytorch

offline:
  mode: pure_offline
  critic_update_during_actor: false

data:
  dataset_path: outputs/ogpo/replays/robotwin_pick_dual_bottles_base_new300_seedblocks57_60_train.pt
  validation_path: outputs/ogpo/replays/robotwin_pick_dual_bottles_base_new300_seedblocks57_60_validation.pt
  behavior_policy: pi05_pytorch_clean50_base
  gamma: 0.995
  gamma_rebase:
    enabled: true
    source_gamma: 0.999
    atol: 0.00002
  n_step: 2
  apply_n_step_on_load: true
  use_execution_mask: true

critic:
  architecture: gemma_siglip_multihead
  ensemble_size: 3
  # Three independent members; each member owns Q1, Q2, and one V head.
  double_q_divl: true
  q_heads_per_member: 2
  q_representation: scalar
  categorical_q: false
  q_loss: mse
  q_vmin: -0.1
  q_vmax: 1.1
  enable_rankq: false
  rankq: false
  rank_consensus_enabled: false
  stage: full_td
  bootstrap_probability: 0.8
  bootstrap_target: memberwise
  target_mode: td
  target_tau: 0.005
  target_update_period: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  steps_per_actor_step: 0
  update_period_actor_steps: 0
  steps_per_refresh: 0
  gate_enabled: false
  force_actor: true
  backbone:
    gemma_path: checkpoints/models/gemma-3-270m
    siglip_path: checkpoints/models/siglip2-so400m-patch14-224-fixed
    camera_keys: [image_base, image_wrist]
    dtype: bfloat16
    max_language_tokens: 64
    train_siglip: true
    train_vlm_full: true
    gradient_checkpointing: true
  gemma_lora:
    final_n_layers: 0

divl:
  enabled: true
  num_atoms: 201
  auto_support: false
  v_min: -0.1
  v_max: 1.1
  # Legacy alpha fields are retained only for old call sites; adaptive_tau
  # takes precedence in the clean double-Q update below.
  alpha_min: 0.0
  alpha_max: 1.0
  adaptive_tau: true
  tau_base: 0.6
  entropy_coefficient: 0.3
  # [0.3, 0.6] is the natural range induced by normalized H∈[0,1].
  tau_min: 0.3
  tau_max: 0.6
  use_adaptive_quantile: true
  interpolate_quantile: false
  loss_weight: 1.0

actor:
  algorithm: full_ogpo
  ogpo_variant: ca_chi2
  use_ca: true
  use_chipo: true
  flash_enabled: false
  temporal_rectification: false
  full_ratio_mode: ais_joint
  # Explicit aliases retained in the config so the intended main-path
  # semantics are unambiguous to launchers and audit scripts.
  ppo_clip: 0.01
  full_chain: true
  advantage_mode: conservative
  group_size: 4
  candidate_group_size: 4
  actor_epochs_per_rollout: 1
  optimizer: adafactor
  learning_rate: 0.000001
  weight_decay: 0.0
  gradient_microbatch_size: 1
  normalize_logprob_by_action_dim: true
  normalize_logprob_by_denoising_steps: true
  ppo_clip_chain: 0.01
  ppo_clip_min: 0.01
  ppo_clip_max: 0.01
  full_chain_log_ratio_clip: 20.0
  advantage_clip: 5.0
  old_policy_sync_period: 1
  old_policy_ema: 0.0
  max_grad_norm: 1.0
  reject_update_on_kl: true
  post_update_kl_action: rollback_cpu
  max_policy_reference_kl: 1.2
  max_consecutive_kl_rejections: 10
  residual_enabled: false
  chi2:
    enabled: true
    ratio_scope: full_chain
    require_single_epoch: true
    normalize_action_dim: true
    normalize_denoising_steps: true
    beta_base: 0.1
    q_std_target: 1.0
    ensemble_alpha: 5.0
    r_max: 10.0
    slow_policy_tau: 0.0005
    slow_policy_update_period: 1
    apply_project_safety_gates: false
    legacy_extra_chi2_loss: false

flow:
  adapter: pi05_pytorch
  checkpoint_dir: checkpoints/pi05/model_clean50
  train_config: pi05_robotwin2_clean50_full
  backend_train_mode: full
  image_container_key: images
  transpose_images_to_chw: true
  image_mapping_override:
    cam_high: image_base
    cam_left_wrist: image_wrist
  num_steps: 10
  sde_mode: ogpo_constant_corrected
  use_constant_noise: true
  error_correct_sde_to_ode: true
  constant_noise_std: 0.005
  learn_sde_std: false
  randn_clip_value: 3.0
  temporal_rectification_mode: none
  temporal_rectification: false

inference:
  dynamics: native_ode

regularization:
  beta_kl: 0.0
  lambda_fm: 0.0
  lambda_success: 0.1
  actor_regularization_epochs_per_rollout: 1
  success_update_period: 1
  success_batch_size: 1

training:
  device: cuda
  seed: 0
  clean_pytorch_main: true
  critic_frozen_during_actor: true
  critic_checkpoint: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_critic_g995/critic_step_04000_final.pt
  actor_start_step: 0
  actor_steps: 2000
  batch_size: 1
  checkpoint_interval: 500
  keep_periodic_checkpoints: true
  checkpoint_path: outputs/ogpo/robotwin_pick_dual_bottles_divl_ogpo_ca_chipo_fullchain_g995_final.pt
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_pick_dual_bottles_divl_ogpo_ca_chipo_fullchain_g995
  metrics_path: outputs/ogpo/robotwin_pick_dual_bottles_divl_ogpo_ca_chipo_fullchain_g995_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_pick_dual_bottles_divl_ogpo_ca_chipo_fullchain_g995

evaluation:
  tasks: [pick_dual_bottles]
  dexjoco_tasks: [pick_dual_bottles]
  policy_dir: checkpoints/pi05/model_clean50
  best_of_n: 1
