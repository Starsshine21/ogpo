  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_catq_20k/latest.pt
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_catq_20k/milestones
  metrics_path: outputs/ogpo/robotwin_mixed1000_bootstrap_catq_20k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_mixed1000_bootstrap_catq_20k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_catq_20k/resolved_config.yaml
  parameter_summary_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_catq_20k/parameter_summary.json
