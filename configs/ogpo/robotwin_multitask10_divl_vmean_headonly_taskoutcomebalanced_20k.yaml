include: configs/ogpo/robotwin_guess1000_nohanging_placeshoe_vmean_tau05_07_gn5_8k.yaml

# C-style frozen-pretrained-backbone critic with hierarchical task/outcome balancing.
critic:
  stage: head_td
  enable_rankq: false
  rankq:
    enabled: false
    lambda_rank: 0.0

training:
  critic_steps: 20000
  resume_checkpoint: null
  early_stopping:
    enabled: false
  critic_sampling:
    mode: task_outcome_balanced
    task_names: [pick_dual_bottles, handover_mic, place_cans_plasticbox, click_bell, dump_bin_bigbin, move_playingcard_away, open_laptop, click_alarmclock, place_a2b_right, place_shoe]
    success_probability: 0.5
    require_multiple_sampled_tasks: true
  checkpoint_path: outputs/ogpo/checkpoints/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k/critic_step_20000_final.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k/latest.pt
  best_checkpoint_path: null
  milestone_steps: [500, 1000, 2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k/milestones
  metrics_path: outputs/ogpo/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k/resolved_config.yaml
  parameter_summary_path: outputs/ogpo/checkpoints/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k/parameter_summary.json
