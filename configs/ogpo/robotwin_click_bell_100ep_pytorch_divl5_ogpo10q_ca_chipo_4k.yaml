include: configs/ogpo/robotwin_pick_dual_bottles_pytorch_divl5_ogpo10q_ca_chipo_fullchain.yaml

data:
  dataset_path: outputs/ogpo/replays/robotwin_click_bell_dense_100ep_g999_train.pt
  validation_path: outputs/ogpo/replays/robotwin_click_bell_dense_100ep_g999_validation.pt
  behavior_policy: pi05_pytorch_clean50_base
  gamma: 0.995
  gamma_rebase:
    enabled: true
    source_gamma: 0.999
    atol: 0.00002
  n_step: 2
  apply_n_step_on_load: true

actor:
  # Long-running A100 partition grants four GPUs; current/old/slow/reference
  # occupy them, while b01's 1TB host memory stores the exact rollback copy.
  rollback_snapshot_device: cpu

training:
  resume_checkpoint: null
  offload_frozen_critic_during_actor_optimization: false
  # Heldout sweep selected the 7k milestone: it has the strongest pair-min
  # ranking for the 10-Q actor interface, ahead of the 8k final checkpoint.
  critic_checkpoint: outputs/ogpo/checkpoints/robotwin_click_bell_divl_5pair_g995_8k/milestones/critic_step_07000.pt
  actor_start_step: 0
  actor_steps: 4000
  # A100-80G runs use bounded walltime; persist a restart point well before
  # a single gpu-normal allocation expires.
  checkpoint_interval: 100
  checkpoint_path: outputs/ogpo/robotwin_click_bell_divl5_ogpo10q_ca_chipo_4k_final.pt
  periodic_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_click_bell_divl5_ogpo10q_ca_chipo_4k
  metrics_path: outputs/ogpo/robotwin_click_bell_divl5_ogpo10q_ca_chipo_4k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_click_bell_divl5_ogpo10q_ca_chipo_4k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_click_bell_divl5_ogpo10q_ca_chipo_4k/resolved_config.yaml

flow:
  pytorch_role_devices:
    current: cuda:0
    old: cuda:1
    slow: cuda:2
    reference: cuda:3

evaluation:
  tasks: [click_bell]
  dexjoco_tasks: [click_bell]
