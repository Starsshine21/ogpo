include: configs/ogpo/robotwin_multitask10_divl_vmean_headonly_taskoutcomebalanced_20k.yaml

data:
  dataset_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/model_init_8.pt
  distributed_dataset_path_pattern: outputs/ogpo/replays/mixed1000_bootstrap_v1/train_rank{rank:02d}.pt
  distributed_dataset_preprocessed: true
  distributed_model_init_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/model_init_8.pt
  distributed_validation_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/validation_80.pt
  validation_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/validation_80.pt

critic:
  bootstrap_probability: 1.0
  member_initialization_seed: 20260915

training:
  critic_steps: 20000
  resume_checkpoint: null
  initial_critic_checkpoint: null
  critic_sampling:
    mode: member_episode_bootstrap
    task_names: [adjust_bottle, click_alarmclock, click_bell, dump_bin_bigbin, handover_mic, open_laptop, pick_dual_bottles, place_a2b_right, place_object_stand, press_stapler]
    success_probability: 0.5
    mask_path: outputs/ogpo/replays/mixed1000_bootstrap_v1/bootstrap_masks.json
    require_multiple_sampled_tasks: true
  checkpoint_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_scalar_20k/critic_step_20000_final.pt
  latest_checkpoint_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_scalar_20k/latest.pt
  best_checkpoint_path: null
  milestone_steps: [2000, 4000, 6000, 8000, 12000, 20000]
  milestone_checkpoint_dir: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_scalar_20k/milestones
  metrics_path: outputs/ogpo/robotwin_mixed1000_bootstrap_scalar_20k_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/robotwin_mixed1000_bootstrap_scalar_20k
  config_snapshot_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_scalar_20k/resolved_config.yaml
  parameter_summary_path: outputs/ogpo/checkpoints/robotwin_mixed1000_bootstrap_scalar_20k/parameter_summary.json

evaluation:
  tasks: [adjust_bottle, click_alarmclock, click_bell, dump_bin_bigbin, handover_mic, open_laptop, pick_dual_bottles, place_a2b_right, place_object_stand, press_stapler]
  dexjoco_tasks: [adjust_bottle, click_alarmclock, click_bell, dump_bin_bigbin, handover_mic, open_laptop, pick_dual_bottles, place_a2b_right, place_object_stand, press_stapler]
