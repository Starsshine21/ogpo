include: configs/ogpo/critic_udivl.yaml

data:
  dataset_path: outputs/ogpo/click_mouse_pi05_replay_train.pt
  validation_path: outputs/ogpo/click_mouse_pi05_replay_validation.pt
  generated_horizon: 30
  executed_horizon: 4
  use_execution_mask: true
  language: click the mouse

critic:
  architecture: gemma_siglip_multihead
  ensemble_size: 3
  stage: head_mc
  action_hidden_dim: 256
  action_attention_heads: 8
  head_hidden_dim: 512
  bootstrap_probability: 0.8
  bootstrap_target: subsample_min
  reference_value_samples: 4
  lambda_divl_target: 0.75
  lambda_mc: 0.0
  target_tau: 0.005
  target_update_period: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  steps_per_actor_step: 1
  max_grad_norm: 5.0
  backbone:
    gemma_path: checkpoints/models/gemma-3-270m
    siglip_path: checkpoints/models/siglip2-so400m-patch14-224-fixed
    camera_keys: [image_base, image_wrist]
    dtype: bfloat16
    max_language_tokens: 64
    train_siglip: false
  gemma_lora:
    final_n_layers: 4
    rank: 8
    alpha: 16.0
    learning_rate: 0.00001
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  stage_gates:
    min_stage_steps: 500
    min_pairwise_ranking_accuracy: 0.55
    min_interval_coverage: 0.8
    max_categorical_saturation: 0.2
    max_abs_exploitation_gap: 0.5
  min_ranking_accuracy: 0.55
  min_coverage: 0.8
  force_actor: false

divl:
  enabled: true
  num_atoms: 51
  auto_support: true
  support_margin_fraction: 0.05

uncertainty:
  adapt_ppo_clip: false
  adapt_kl_beta: false
  use_conformal: true
  conformal_delta: 0.1
  min_calibration_samples: 64
  positive_margin: 0.0
  negative_margin: 0.0
  entropy_scale: 0.5
  entropy_skip_threshold: 0.98
  consensus_skip_threshold: 0.05
  use_support_weight: true
  lambda_epi: 0.5
  lambda_support: 0.5
  support_threshold: 10.0

actor:
  advantage_mode: sign_consensus
  lambda_abs_start: 1.0
  lambda_abs_end: 1.0
  lambda_abs_warmup_steps: 0
  group_size: 4
  old_policy_sync_period: 1
  old_policy_ema: 0.995

flow:
  adapter: gaussian_openpi
  convention: openpi_pi05_euler
  num_steps: 10
  stochastic_variance: 0.0001
  sde_mode: ogpo_corrected

regularization:
  beta_kl: 0.01
  lambda_fm: 0.1
  lambda_success: 0.1

training:
  device: cuda
  seed: 0
  critic_steps: 6000
  batch_size: 4
  checkpoint_path: outputs/ogpo/click_mouse_gemma_udivl.pt
  metrics_path: outputs/ogpo/click_mouse_gemma_udivl_metrics.jsonl
  tensorboard_dir: outputs/ogpo/tensorboard/click_mouse_gemma_udivl
  early_stopping:
    enabled: true
    metric: validation_q_huber
    mode: min
    patience: 20
    min_delta: 0.0001

evaluation:
  interval: 50
  validation_batch_size: 16
  best_of_n: 1
  tasks: [click_mouse]
  dexjoco_tasks: [click_mouse]
